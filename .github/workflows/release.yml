name: Release IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify & Release OpenWrt IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & Run Tests
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Build Frontend SPA
        run: node scripts/build-frontend.mjs

      - name: Build OpenWrt IPK (PKGARCH=all)
        run: node scripts/build-ipk.mjs

      - name: Build OpenWrt 24.10 SDK IPK (official buildroot verification)
        uses: openwrt/gh-action-sdk@main
        continue-on-error: true
        env:
          ARCH: x86_64-openwrt-24.10
          FEEDNAME: nikkidash
          PACKAGES: nikki-dash
          NO_REFRESH_CHECK: true

      - name: Collect SDK IPK if produced
        run: |
          if ls bin/packages/x86_64/nikkidash/nikki-dash_*.ipk >/dev/null 2>&1; then
            cp -v bin/packages/x86_64/nikkidash/nikki-dash_*.ipk dist/
            (cd dist && sha256sum *.ipk > SHA256SUMS)
          fi
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Run OpenWrt 24.10 Live Container Verification
        run: |
          curl -fsSL https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-24.10.4-x86-64-rootfs.tar.gz -o /tmp/owrt2410.tar.gz
          docker import /tmp/owrt2410.tar.gz openwrt-24.10-ci:latest
          docker run --rm -v "$PWD:/mnt:ro" openwrt-24.10-ci:latest /bin/sh /mnt/scripts/verify-openwrt-docker.sh

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nikki-dash-release
          path: |
            dist/*.ipk
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/SHA256SUMS
