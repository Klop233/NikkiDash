name: Release IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify & Release OpenWrt IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & Run Tests
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Build Frontend SPA
        run: node scripts/build-frontend.mjs

      - name: Build OpenWrt IPK (PKGARCH=all)
        run: node scripts/build-ipk.mjs

      - name: Run OpenWrt 24.10 Live Container Verification (real opkg + uhttpd + rpcd + ucode)
        run: |
          curl -fsSL https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-24.10.4-x86-64-rootfs.tar.gz -o /tmp/owrt2410.tar.gz
          docker import /tmp/owrt2410.tar.gz openwrt-24.10-ci:latest
          docker run --rm -v "$PWD:/mnt:ro" openwrt-24.10-ci:latest /bin/sh /mnt/scripts/verify-openwrt-docker.sh

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nikki-dash-release
          path: |
            dist/*.ipk
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/SHA256SUMS
