name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Frontend & Schema Tests + IPK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck & Unit/UI/Security Tests
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test

      - name: Build Frontend SPA
        run: node scripts/build-frontend.mjs

      - name: Build deterministic IPK
        run: node scripts/build-ipk.mjs

      - name: Verify live OpenWrt 24.10 container integration
        run: |
          curl -fsSL https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-24.10.4-x86-64-rootfs.tar.gz -o /tmp/owrt2410.tar.gz
          docker import /tmp/owrt2410.tar.gz openwrt-24.10-ci:latest
          docker run --rm -v "$PWD:/mnt:ro" openwrt-24.10-ci:latest /bin/sh /mnt/scripts/verify-openwrt-docker.sh

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikki-dash-ipk
          path: |
            dist/*.ipk
            dist/SHA256SUMS
